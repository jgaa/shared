name: Release GA

on:
  workflow_dispatch:

jobs:
  release:
    name: Create GA release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare release metadata
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin main

          app_version="$(sed -nE 's/^project\(shared_desktop VERSION ([^ ]+) LANGUAGES CXX\)$/\1/p' desktop/CMakeLists.txt)"
          if [ -z "${app_version}" ]; then
            echo "Failed to read VERSION from desktop/CMakeLists.txt" >&2
            exit 1
          fi

          tag="v${app_version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          main_sha="$(git rev-parse HEAD)"
          artifact_name="shared-flatpak-${app_version}"
          bundle_name="shared-${app_version}.flatpak"

          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"

          {
            echo "app_version=${app_version}"
            echo "tag=${tag}"
            echo "main_sha=${main_sha}"
            echo "artifact_name=${artifact_name}"
            echo "bundle_name=${bundle_name}"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          PREVIOUS_TAG: ${{ steps.prep.outputs.previous_tag }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          {
            echo "## Changes"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log --reverse --format='- %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --reverse --max-count=20 --format='- %s'
            fi
          } > "${notes_file}"

          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Find Flatpak artifact for current main
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.prep.outputs.main_sha }}
          ARTIFACT_NAME: ${{ steps.prep.outputs.artifact_name }}
        run: |
          set -euo pipefail

          run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/flatpak.yml/runs?branch=main&event=push&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"${MAIN_SHA}\" and .conclusion == \"success\") | .id" \
              | head -n 1
          )"

          if [ -z "${run_id}" ]; then
            echo "No successful Flatpak workflow run found for main commit ${MAIN_SHA}" >&2
            exit 1
          fi

          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" \
              | head -n 1
          )"

          if [ -z "${artifact_id}" ]; then
            echo "Artifact ${ARTIFACT_NAME} not found in workflow run ${run_id}" >&2
            exit 1
          fi

          {
            echo "run_id=${run_id}"
            echo "artifact_id=${artifact_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.prep.outputs.artifact_name }}
        run: |
          set -euo pipefail

          mkdir -p release-artifact
          gh run download "${RUN_ID}" --name "${ARTIFACT_NAME}" --dir release-artifact

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          MAIN_SHA: ${{ steps.prep.outputs.main_sha }}
          BUNDLE_NAME: ${{ steps.prep.outputs.bundle_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          asset_path="release-artifact/${BUNDLE_NAME}"
          if [ ! -f "${asset_path}" ]; then
            echo "Expected asset ${asset_path} was not downloaded" >&2
            exit 1
          fi

          gh release create "${TAG}" "${asset_path}" \
            --target "${MAIN_SHA}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}"
